[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kryomai-core"
version = "0.1.5"
description = "Core foundation for KryomAI Intelligence OS."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "KryomAI"}
]

[tool.setuptools.packages.find]
where = ["src"]